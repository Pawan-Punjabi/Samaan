[project]
name = "visual-dataflow-transpiler-backend"
version = "0.1.0"
description = "Group 18 Interactive Node-Based Data Profiling & Retail Analytics Platform Backend"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
python-version = "3.11"
python-interpreter-path = ".venv/Scripts/python.exe"
search-path = ["."]
site-package-path = [".venv/Lib/site-packages"]
